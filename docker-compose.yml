services:
  atlas:
    build: .
    env_file:
      - .env
    environment:
      ATLAS_OBSIDIAN_VAULT_PATH: /obsidian
      ATLAS_WEB_SEARCH_ENABLED: "true"
      ATLAS_SEARXNG_BASE_URL: http://searxng:8080
    ports:
      - "8000:8000"
    init: true
    restart: unless-stopped
    volumes:
      - atlas-data:/app/data
      - ${ATLAS_OBSIDIAN_HOST_VAULT_PATH:-/Users/sam/Documents/Obsidian Vault}:/obsidian:${ATLAS_OBSIDIAN_MOUNT_MODE:-ro}

  frontend:
    build:
      context: ./frontend
    environment:
      ATLAS_API_URL: http://atlas:8000
      ATLAS_UI_ALLOWED_HOSTS: cortex
    ports:
      - "3001:3001"
    depends_on:
      - atlas
    init: true
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${ATLAS_SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    depends_on:
      - searxng-valkey
    volumes:
      - ./searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    init: true
    restart: unless-stopped

  searxng-valkey:
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - searxng-valkey-data:/data
    init: true
    restart: unless-stopped

volumes:
  atlas-data:
  searxng-cache:
  searxng-valkey-data:
