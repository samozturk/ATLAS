[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-home"
version = "0.1.0"
description = "ATLAS: a reliable, event-driven home AI system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiomqtt>=2.5,<3",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "structlog>=24.4,<26.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[project.scripts]
atlas = "atlas.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
